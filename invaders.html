<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE INVADERS</title>
<style>
  :root {
    --neon: #00ff66;
    --bg: #05070a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--neon);
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  h1 {
    letter-spacing: 8px;
    font-size: 28px;
    text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 640px;
    font-size: 16px;
    letter-spacing: 2px;
  }
  canvas {
    background: #000;
    border: 2px solid var(--neon);
    box-shadow: 0 0 20px rgba(0,255,102,0.5), inset 0 0 20px rgba(0,255,102,0.15);
    image-rendering: pixelated;
  }
  #msg {
    position: absolute;
    text-align: center;
    font-size: 20px;
    letter-spacing: 3px;
    text-shadow: 0 0 10px var(--neon);
    display: none;
    background: rgba(0,0,0,0.7);
    padding: 30px 50px;
    border: 1px solid var(--neon);
  }
  #msg span {
    display: block;
    font-size: 13px;
    margin-top: 15px;
    color: #7dff9d;
  }
  #touch {
    display: none;
    gap: 14px;
    margin-top: 6px;
  }
  #touch button {
    width: 70px;
    height: 50px;
    background: #000;
    color: var(--neon);
    border: 2px solid var(--neon);
    font-size: 18px;
    font-family: inherit;
    border-radius: 6px;
    touch-action: none;
  }
  #footer {
    font-size: 11px;
    color: #4a8d5f;
    letter-spacing: 1px;
  }
  @media (max-width: 700px) {
    canvas { width: 96vw; height: auto; }
    #hud { width: 96vw; }
    #touch { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>SPACE INVADERS</h1>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>HIGH: <span id="high">0</span></div>
    <div>LIVES: <span id="lives">3</span></div>
    <div>WAVE: <span id="wave">1</span></div>
  </div>
  <div style="position:relative;">
    <canvas id="game" width="640" height="560"></canvas>
    <div id="msg"></div>
  </div>
  <div id="touch">
    <button id="btnLeft">◀</button>
    <button id="btnFire">FIRE</button>
    <button id="btnRight">▶</button>
  </div>
  <div id="footer">← → 또는 A/D 이동 · SPACE 발사 · P 일시정지 · Enter 시작/재시작</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');
  const livesEl = document.getElementById('lives');
  const waveEl = document.getElementById('wave');
  const msgEl = document.getElementById('msg');

  const HIGH_KEY = 'invaders_high_score';
  let highScore = parseInt(localStorage.getItem(HIGH_KEY) || '0', 10);
  highEl.textContent = highScore;

  // ---------- Game state ----------
  let state = 'ready'; // ready | playing | paused | gameover | win
  let score = 0, lives = 3, wave = 1;
  let keys = {};
  let lastTime = 0;
  let starField = [];

  const player = {
    w: 34, h: 16,
    x: W / 2 - 17, y: H - 40,
    speed: 320,
    cooldown: 0,
  };

  let bullets = [];      // player bullets
  let enemyBullets = [];
  let invaders = [];
  let invaderDir = 1;
  let invaderSpeed = 30; // px/s baseline, scales with wave & remaining count
  let invaderDropTimer = 0;
  let shootTimer = 0;
  let bunkers = [];

  const ROWS = 5, COLS = 10;
  const INV_W = 28, INV_H = 20, GAP_X = 14, GAP_Y = 16;
  const GRID_LEFT = (W - (COLS * (INV_W + GAP_X) - GAP_X)) / 2;
  const GRID_TOP = 60;

  function initStars() {
    starField = [];
    for (let i = 0; i < 80; i++) {
      starField.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        s: Math.random() * 20 + 5,
      });
    }
  }
  initStars();

  function makeInvaders() {
    invaders = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        invaders.push({
          x: GRID_LEFT + c * (INV_W + GAP_X),
          y: GRID_TOP + r * (INV_H + GAP_Y),
          w: INV_W, h: INV_H,
          alive: true,
          type: r === 0 ? 2 : (r <= 2 ? 1 : 0),
          points: r === 0 ? 30 : (r <= 2 ? 20 : 10),
        });
      }
    }
    invaderDir = 1;
    invaderSpeed = 30 + (wave - 1) * 8;
  }

  function makeBunkers() {
    bunkers = [];
    const count = 4;
    const bw = 60, bh = 36;
    const spacing = W / count;
    for (let i = 0; i < count; i++) {
      const bx = spacing * i + spacing / 2 - bw / 2;
      const by = H - 130;
      const blocks = [];
      const cell = 6;
      for (let row = 0; row < bh / cell; row++) {
        for (let col = 0; col < bw / cell; col++) {
          // carve a simple bunker shape (arch cutout at bottom middle)
          const midCol = bw / cell / 2;
          const isArch = row >= bh / cell - 3 && Math.abs(col - midCol) < 2;
          if (!isArch) {
            blocks.push({ x: bx + col * cell, y: by + row * cell, alive: true });
          }
        }
      }
      bunkers.push({ blocks, cell });
    }
  }

  function resetGame() {
    score = 0; lives = 3; wave = 1;
    player.x = W / 2 - player.w / 2;
    bullets = []; enemyBullets = [];
    makeInvaders();
    makeBunkers();
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    waveEl.textContent = wave;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem(HIGH_KEY, String(highScore));
      highEl.textContent = highScore;
    }
  }

  function showMsg(html) {
    msgEl.innerHTML = html;
    msgEl.style.display = 'block';
    msgEl.style.left = (canvas.offsetLeft + W / 2 - msgEl.offsetWidth / 2) + 'px';
    // center via flex trick instead
    msgEl.style.position = 'absolute';
    msgEl.style.top = '50%';
    msgEl.style.left = '50%';
    msgEl.style.transform = 'translate(-50%, -50%)';
  }
  function hideMsg() {
    msgEl.style.display = 'none';
  }

  showMsg('PRESS ENTER TO START<span>WASD / 화살표 이동 · SPACE 발사</span>');

  // ---------- Input ----------
  window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'Enter') {
      if (state === 'ready' || state === 'gameover' || state === 'win') {
        resetGame();
        state = 'playing';
        hideMsg();
      }
    }
    if (e.key.toLowerCase() === 'p') {
      if (state === 'playing') { state = 'paused'; showMsg('PAUSED<span>Press P to resume</span>'); }
      else if (state === 'paused') { state = 'playing'; hideMsg(); }
    }
    if (e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  // touch controls
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const btnFire = document.getElementById('btnFire');
  function bindHold(btn, key) {
    const on = (e) => { e.preventDefault(); keys[key] = true; };
    const off = (e) => { e.preventDefault(); keys[key] = false; };
    btn.addEventListener('touchstart', on);
    btn.addEventListener('touchend', off);
    btn.addEventListener('touchcancel', off);
    btn.addEventListener('mousedown', on);
    btn.addEventListener('mouseup', off);
    btn.addEventListener('mouseleave', off);
  }
  bindHold(btnLeft, 'arrowleft');
  bindHold(btnRight, 'arrowright');
  bindHold(btnFire, ' ');

  canvas.addEventListener('touchstart', () => {
    if (state === 'ready' || state === 'gameover' || state === 'win') {
      resetGame();
      state = 'playing';
      hideMsg();
    }
  });

  // ---------- Update ----------
  function firePlayerBullet() {
    if (player.cooldown <= 0 && bullets.length < 4) {
      bullets.push({ x: player.x + player.w / 2 - 2, y: player.y - 10, w: 4, h: 12, speed: 480 });
      player.cooldown = 0.35;
    }
  }

  function aliveInvaders() {
    return invaders.filter(inv => inv.alive);
  }

  function update(dt) {
    // stars
    for (const s of starField) {
      s.y += s.s * dt;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    if (state !== 'playing') return;

    // player movement
    if (keys['arrowleft'] || keys['a']) player.x -= player.speed * dt;
    if (keys['arrowright'] || keys['d']) player.x += player.speed * dt;
    player.x = Math.max(4, Math.min(W - player.w - 4, player.x));

    if (player.cooldown > 0) player.cooldown -= dt;
    if (keys[' ']) firePlayerBullet();

    // player bullets
    for (const b of bullets) b.y -= b.speed * dt;
    bullets = bullets.filter(b => b.y + b.h > 0);

    // enemy bullets
    for (const b of enemyBullets) b.y += b.speed * dt;
    enemyBullets = enemyBullets.filter(b => b.y < H);

    // invader movement
    const alive = aliveInvaders();
    if (alive.length > 0) {
      const speedScale = 1 + (COLS * ROWS - alive.length) / (COLS * ROWS) * 3.5;
      const dx = invaderDir * invaderSpeed * speedScale * dt;
      let minX = Infinity, maxX = -Infinity;
      for (const inv of alive) {
        minX = Math.min(minX, inv.x);
        maxX = Math.max(maxX, inv.x + inv.w);
      }
      let hitEdge = false;
      if (minX + dx < 10 || maxX + dx > W - 10) hitEdge = true;

      if (hitEdge) {
        invaderDir *= -1;
        for (const inv of alive) inv.y += 16;
      } else {
        for (const inv of alive) inv.x += dx;
      }

      // check invaders reaching player / bunkers
      for (const inv of alive) {
        if (inv.y + inv.h >= player.y) {
          endGame(false);
          return;
        }
      }

      // enemy shooting
      shootTimer -= dt;
      if (shootTimer <= 0) {
        const shooters = alive.filter(inv => {
          return !alive.some(o => o !== inv && Math.abs(o.x - inv.x) < 4 && o.y > inv.y);
        });
        if (shooters.length > 0) {
          const shooter = shooters[Math.floor(Math.random() * shooters.length)];
          enemyBullets.push({ x: shooter.x + shooter.w / 2 - 2, y: shooter.y + shooter.h, w: 4, h: 12, speed: 180 + wave * 10 });
        }
        shootTimer = Math.max(0.25, 0.9 - wave * 0.05 - (COLS * ROWS - alive.length) * 0.01);
      }
    } else {
      // wave cleared
      wave++;
      makeInvaders();
      bullets = [];
      enemyBullets = [];
      updateHud();
    }

    // collisions: player bullets vs invaders
    for (const b of bullets) {
      for (const inv of invaders) {
        if (!inv.alive) continue;
        if (rectHit(b, inv)) {
          inv.alive = false;
          b.dead = true;
          score += inv.points;
          updateHud();
          break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);

    // collisions: bullets vs bunkers
    for (const bunker of bunkers) {
      for (const block of bunker.blocks) {
        if (!block.alive) continue;
        const brect = { x: block.x, y: block.y, w: bunker.cell, h: bunker.cell };
        for (const b of bullets) {
          if (!b.dead && rectHit(b, brect)) { block.alive = false; b.dead = true; }
        }
        for (const b of enemyBullets) {
          if (!b.dead && rectHit(b, brect)) { block.alive = false; b.dead = true; }
        }
      }
    }
    bullets = bullets.filter(b => !b.dead);
    enemyBullets = enemyBullets.filter(b => !b.dead);

    // collisions: enemy bullets vs player
    for (const b of enemyBullets) {
      if (rectHit(b, player)) {
        b.dead = true;
        loseLife();
      }
    }
    enemyBullets = enemyBullets.filter(b => !b.dead);
  }

  function rectHit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function loseLife() {
    lives--;
    updateHud();
    if (lives <= 0) {
      endGame(false);
    } else {
      player.x = W / 2 - player.w / 2;
      enemyBullets = [];
    }
  }

  function endGame(won) {
    state = won ? 'win' : 'gameover';
    if (won) {
      showMsg('YOU WIN!<span>Score: ' + score + ' &middot; Press Enter to restart</span>');
    } else {
      showMsg('GAME OVER<span>Score: ' + score + ' &middot; High: ' + highScore + ' &middot; Press Enter to restart</span>');
    }
  }

  // ---------- Draw ----------
  function drawStars() {
    ctx.fillStyle = '#0a1a12';
    for (const s of starField) {
      ctx.globalAlpha = 0.5;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    ctx.fillStyle = '#00ff66';
    ctx.shadowColor = '#00ff66';
    ctx.shadowBlur = 8;
    // simple cannon shape
    ctx.fillRect(player.x, player.y + 6, player.w, player.h - 6);
    ctx.fillRect(player.x + player.w / 2 - 3, player.y, 6, 8);
    ctx.shadowBlur = 0;
  }

  function drawInvader(inv) {
    if (!inv.alive) return;
    const colors = ['#ff3366', '#ffcc00', '#00ccff'];
    ctx.fillStyle = colors[inv.type];
    ctx.shadowColor = colors[inv.type];
    ctx.shadowBlur = 6;
    const x = inv.x, y = inv.y, w = inv.w, h = inv.h;
    // simple invader pixel-ish shape
    ctx.fillRect(x + w * 0.2, y, w * 0.6, h * 0.3);
    ctx.fillRect(x, y + h * 0.3, w, h * 0.4);
    ctx.fillRect(x + w * 0.1, y + h * 0.7, w * 0.2, h * 0.3);
    ctx.fillRect(x + w * 0.7, y + h * 0.7, w * 0.2, h * 0.3);
    ctx.shadowBlur = 0;
  }

  function drawBunkers() {
    ctx.fillStyle = '#33cc55';
    for (const bunker of bunkers) {
      for (const block of bunker.blocks) {
        if (block.alive) ctx.fillRect(block.x, block.y, bunker.cell - 1, bunker.cell - 1);
      }
    }
  }

  function drawBullets() {
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 6;
    for (const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ff5555';
    ctx.shadowColor = '#ff5555';
    ctx.shadowBlur = 6;
    for (const b of enemyBullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur = 0;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    drawBunkers();
    for (const inv of invaders) drawInvader(inv);
    drawPlayer();
    drawBullets();

    // ground line
    ctx.strokeStyle = 'rgba(0,255,102,0.3)';
    ctx.beginPath();
    ctx.moveTo(0, H - 20);
    ctx.lineTo(W, H - 20);
    ctx.stroke();
  }

  // ---------- Loop ----------
  function loop(ts) {
    const dt = Math.min(0.033, (ts - lastTime) / 1000 || 0);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
